<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>三年的回忆</title>
<style>
  :root{
    --pink:#ff8fb1;
    --gold:#ffd6a5;
    --blue:#a5d8ff;
    --muted:#b9b4cc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(ellipse at 18% 12%, rgba(90,40,140,.55) 0%, transparent 48%),
      radial-gradient(ellipse at 86% 82%, rgba(20,80,120,.45) 0%, transparent 46%),
      radial-gradient(ellipse at 50% 50%, #150c25 0%, #07060d 72%);
    color:#fff;
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  /* ── 背景层 ── */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#fff;
    animation:twinkle var(--d,4s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes twinkle{
    0%,100%{opacity:.08;transform:scale(.7)}
    50%{opacity:.85;transform:scale(1.15)}
  }

  .glow{
    position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;
    animation:drift 18s ease-in-out infinite alternate;
  }
  .glow.g1{width:280px;height:280px;background:#7b3fa0;top:-60px;left:-80px}
  .glow.g2{width:320px;height:320px;background:#1f5b8a;bottom:-100px;right:-90px;animation-delay:-6s}
  .glow.g3{width:200px;height:200px;background:#a0426e;top:45%;left:60%;animation-delay:-11s}
  @keyframes drift{
    from{transform:translate3d(0,0,0) scale(1)}
    to{transform:translate3d(30px,-40px,0) scale(1.15)}
  }

  .particle{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,165,.9),rgba(255,214,165,0) 70%);
    animation:float var(--fd,14s) linear infinite;
    animation-delay:var(--pdelay,0s);
    opacity:0;
  }
  @keyframes float{
    0%{transform:translate3d(0,0,0);opacity:0}
    12%{opacity:.6}
    88%{opacity:.6}
    100%{transform:translate3d(var(--dx,20px),-115vh,0);opacity:0}
  }

  /* ── 内容 ── */
  .wrap{
    position:relative;z-index:2;
    text-align:center;
    padding:0 28px;
    max-width:640px;
  }

  .year{
    font-size:12px;
    letter-spacing:.62em;
    color:#8f8aa8;
    margin-bottom:26px;
    text-indent:.62em;
    opacity:0;
    animation:fadeUp .9s cubic-bezier(.22,1,.36,1) .15s forwards;
  }

  h1{
    margin:0;
    font-size:clamp(40px,12vw,90px);
    font-weight:700;
    line-height:1.15;
    letter-spacing:.08em;
    text-indent:.08em;
    background:linear-gradient(110deg,#ff8fb1 0%,#ffd6a5 28%,#a5d8ff 55%,#e0b0ff 78%,#ff8fb1 100%);
    background-size:280% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,143,177,.22));
    opacity:0;
    animation:flow 9s linear infinite, fadeUp 1.2s cubic-bezier(.22,1,.36,1) .35s forwards;
  }
  @keyframes flow{to{background-position:280% 0}}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }

  .divider{
    display:flex;align-items:center;justify-content:center;
    gap:12px;
    margin:30px auto 26px;
    opacity:0;
    animation:fadeUp .9s ease .85s forwards;
  }
  .divider .line{
    width:52px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,214,165,.75));
  }
  .divider .line.r{
    background:linear-gradient(90deg,rgba(255,214,165,.75),transparent);
  }
  .divider .diamond{
    width:7px;height:7px;
    border:1px solid rgba(255,214,165,.85);
    transform:rotate(45deg);
    animation:pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{transform:rotate(45deg) scale(1);opacity:.55}
    50%{transform:rotate(45deg) scale(1.25);opacity:1}
  }

  .sub{
    font-size:clamp(12px,3.5vw,15px);
    color:var(--muted);
    letter-spacing:.34em;
    text-indent:.34em;
    line-height:2;
    opacity:0;
    animation:fadeUp 1s ease 1.05s forwards;
  }

  .dots{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:38px;
    opacity:0;
    animation:fadeUp 1s ease 1.3s forwards;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    animation:beat 2.6s ease-in-out infinite;
  }
  .dot:nth-child(1){background:var(--gold)}
  .dot:nth-child(2){background:var(--pink);animation-delay:.35s}
  .dot:nth-child(3){background:var(--blue);animation-delay:.7s}
  @keyframes beat{
    0%,100%{transform:scale(1);opacity:.35}
    50%{transform:scale(1.55);opacity:1}
  }

  .foot{
    position:fixed;
    left:0;right:0;
    bottom:calc(26px + env(safe-area-inset-bottom));
    z-index:2;
    text-align:center;
    font-size:11px;
    letter-spacing:.28em;
    color:#5d5870;
    opacity:0;
    animation:fadeUp 1s ease 1.6s forwards;
  }

  /* 点击反馈 */
  h1.tap{
    filter:drop-shadow(0 0 46px rgba(255,143,177,.72));
    transition:filter .12s ease;
  }

  /* ── 隐藏彩蛋页 ── */
  .secret{
    position:fixed;inset:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 32%, rgba(140,25,70,.72) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 105%, rgba(60,12,80,.55) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, #14060f 0%, #06030a 75%);
    opacity:0;pointer-events:none;
    transition:opacity .9s ease;
  }
  .secret.on{opacity:1;pointer-events:auto}

  .secret .grain{
    position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.16) 1px, transparent 1px);
    background-size:3px 3px;opacity:.25;
    mask-image:radial-gradient(ellipse at center, #000 20%, transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at center, #000 20%, transparent 70%);
  }

  .secret .halo{
    position:absolute;
    width:min(78vw,420px);height:min(78vw,420px);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,95,143,.22) 0%, transparent 62%);
    filter:blur(10px);
    animation:haloPulse 4s ease-in-out infinite;
  }
  @keyframes haloPulse{
    0%,100%{transform:scale(1);opacity:.8}
    50%{transform:scale(1.12);opacity:1}
  }

  .secret .inner{
    position:relative;z-index:2;text-align:center;padding:0 26px;
    opacity:0;transform:translateY(26px);
    transition:opacity 1s cubic-bezier(.22,1,.36,1) .35s, transform 1s cubic-bezier(.22,1,.36,1) .35s;
  }
  .secret.on .inner{opacity:1;transform:none}

  .s-name{
    font-size:clamp(52px,16vw,120px);
    font-weight:800;
    line-height:1.1;
    letter-spacing:.12em;
    text-indent:.12em;
    background:linear-gradient(115deg,#ff5f8f 0%,#ffb3c8 32%,#fff0f4 52%,#ffb3c8 72%,#ff5f8f 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,95,143,.45));
    animation:sFlow 7s linear infinite;
  }
  @keyframes sFlow{to{background-position:260% 0}}

  .s-text{
    margin-top:26px;
    font-size:clamp(20px,6.4vw,38px);
    font-weight:500;
    letter-spacing:.34em;
    text-indent:.34em;
    color:#ffe3ec;
    text-shadow:0 0 22px rgba(255,95,143,.5);
    opacity:0;
    animation:fadeUp 1s ease 1.1s forwards;
  }

  .s-heart{
    margin-top:34px;
    font-size:clamp(24px,7vw,40px);
    color:#ff5f8f;
    filter:drop-shadow(0 0 18px rgba(255,95,143,.7));
    animation:heartBeat 1.5s ease-in-out infinite;
  }
  @keyframes heartBeat{
    0%,100%{transform:scale(1)}
    14%{transform:scale(1.22)}
    28%{transform:scale(1)}
    42%{transform:scale(1.16)}
    56%{transform:scale(1)}
  }

  .s-tip{
    position:absolute;
    left:0;right:0;
    bottom:calc(34px + env(safe-area-inset-bottom));
    z-index:3;
    text-align:center;
    font-size:12px;
    letter-spacing:.22em;
    color:#95707f;
    opacity:0;
    animation:fadeUp 1s ease 1.5s forwards;
  }
  .s-tip a{color:#ff9dbb;text-decoration:none;border-bottom:1px solid rgba(255,157,187,.4)}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
  }
</style>
</head>
<body>

<div class="sky" id="sky">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
</div>

<main class="wrap">
  <div class="year">2022 &nbsp;—&nbsp; 2025</div>
  <h1>三年的回忆</h1>
  <div class="divider">
    <span class="line"></span>
    <span class="diamond"></span>
    <span class="line r"></span>
  </div>
  <div class="sub">走过的每一步<br>都算数</div>
  <div class="dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</main>

<div class="foot">THE&nbsp;&nbsp;MEMORY&nbsp;&nbsp;OF&nbsp;&nbsp;THREE&nbsp;&nbsp;YEARS</div>

<div class="secret" id="secret" aria-hidden="true">
  <div class="grain"></div>
  <div class="halo"></div>
  <div class="inner">
    <div class="s-name">张苏琪</div>
    <div class="s-text">我喜欢你</div>
    <div class="s-heart">❤</div>
  </div>
  <div class="s-tip" id="sTip">3 秒后为你打开网易云</div>
</div>

<script>
(function () {
  var sky = document.getElementById('sky');
  if (!sky) return;

  var frag = document.createDocumentFragment();

  // 星星
  for (var i = 0; i < 70; i++) {
    var s = document.createElement('span');
    s.className = 'star';
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top = (Math.random() * 100).toFixed(2) + '%';
    var size = (Math.random() * 1.6 + 1).toFixed(2);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.setProperty('--d', (Math.random() * 4 + 2.5).toFixed(2) + 's');
    s.style.setProperty('--delay', (Math.random() * 5).toFixed(2) + 's');
    frag.appendChild(s);
  }

  // 上浮光点
  for (var j = 0; j < 16; j++) {
    var p = document.createElement('span');
    p.className = 'particle';
    var d = (Math.random() * 3 + 3).toFixed(1);
    p.style.width = d + 'px';
    p.style.height = d + 'px';
    p.style.left = (Math.random() * 100).toFixed(2) + '%';
    p.style.bottom = '-10px';
    p.style.setProperty('--fd', (Math.random() * 12 + 12).toFixed(1) + 's');
    p.style.setProperty('--pdelay', (Math.random() * 14).toFixed(1) + 's');
    p.style.setProperty('--dx', (Math.random() * 80 - 40).toFixed(0) + 'px');
    frag.appendChild(p);
  }

  sky.appendChild(frag);
})();

/* ── 三击彩蛋（ENABLE_EGG = false 可关闭） ── */
(function () {
  var ENABLE_EGG = true;
  if (!ENABLE_EGG) return;

  // 想换成具体某首歌，把下面这行换成歌曲链接，例如：
  // https://music.163.com/#/song?id=1901371647
  var MUSIC_URL = "https://music.163.com/#/search/m/?s=%E6%88%91%E5%96%9C%E6%AC%A2%E4%BD%A0&type=1";

  var h1 = document.querySelector(".wrap h1");
  var tapArea = document.querySelector(".wrap") || h1;
  var secret = document.getElementById("secret");
  var tip = document.getElementById("sTip");
  if (!h1 || !secret) return;

  var taps = 0, last = 0, fired = false, tapTimer = null;

  function bump() {
    h1.classList.add("tap");
    clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { h1.classList.remove("tap"); }, 140);
  }

  function onTap() {
    if (fired) return;
    var now = Date.now();
    if (now - last > 900) taps = 0;
    taps++;
    last = now;
    bump();
    if (taps >= 3) { taps = 0; openSecret(); }
  }

  // 整个内容区都能点，不限于文字本身
  tapArea.addEventListener("click", onTap);

  function openSecret() {
    if (fired) return;
    fired = true;
    secret.classList.add("on");
    secret.setAttribute("aria-hidden", "false");

    var n = 3;
    var iv = setInterval(function () {
      n--;
      if (n > 0) tip.textContent = n + " 秒后为你打开网易云";
    }, 1000);

    setTimeout(function () {
      clearInterval(iv);
      tip.innerHTML = '正在打开… <a href="' + MUSIC_URL + '">点此手动打开</a>';
      window.location.href = MUSIC_URL;
    }, 3000);
  }
})();
</script>
</body>
</html>
